[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doi2pdf"
version = "1.0.2"
description = "按 DOI 从 Sci-Hub 下载论文 PDF 的命令行工具"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "xxqcn" }]
keywords = ["doi", "pdf", "scihub", "academic", "literature"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
doi2pdf = "doi2pdf.cli:main"

[tool.setuptools]
# 平铺结构：本目录即包 doi2pdf，模块直接放在仓库根。
# 声明为 packages 而非 py-modules，__init__.py / __main__.py 才会进 wheel，
# `python -m doi2pdf` 与 `import doi2pdf` 才能工作。
packages = ["doi2pdf"]
package-dir = { "doi2pdf" = "." }
# 不加入根目录的其它散模块，避免 wheel 里出现重复的顶层 cli.py / scihub.py。
# （setuptools 默认会遍历 package-dir，用 include 限定即可）
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
